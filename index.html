<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hologram 3D</title>
<style>
:root{--bg:#02070d;--fg:#7df9ff;--dim:#5fd6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 55%,#06222e,var(--bg) 70%);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
canvas#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
h1{font-size:16px;color:#aaf6ff;text-shadow:0 1px 4px #000;letter-spacing:.2em;margin:0;text-transform:uppercase}
#status{font-size:14px;font-weight:600;color:#fff;margin-top:8px;max-width:230px;text-shadow:0 1px 4px #000,0 0 10px #000;line-height:1.4}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
#vid{width:110px;height:82px;border:1px solid var(--dim);transform:scaleX(-1);object-fit:cover;opacity:.7;display:none;border-radius:6px}
.bar{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
button{background:rgba(2,15,24,.8);color:#fff;font-weight:600;border:1px solid var(--dim);padding:9px 14px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer}
button.on{background:rgba(125,249,255,.25);box-shadow:0 0 12px var(--fg)}
#help{position:absolute;left:12px;background:rgba(2,15,24,.72);border:1px solid #2f8f9a;border-radius:10px;padding:10px 12px;color:#e8fdff;text-shadow:0 1px 3px #000;bottom:calc(72px + env(safe-area-inset-bottom,0px));font-size:13px;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div><h1>◈ Hologram 3D</h1><div id="status">Drag to rotate · scroll to zoom. Enable camera for hand control.</div></div><div class="right"><button id="bCam">Enable camera</button><video id="vid" playsinline muted></video></div></div>
<div id="help">✋ move hand → position<br>🔄 tilt hand → rotate<br>🤏 thumb–index spread → zoom<br>✊ fist → explode building</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(()=>{
if(typeof THREE==='undefined'){document.getElementById('status').textContent='Could not load 3D library - check your internet connection.'}
const $=id=>document.getElementById(id)||{style:{},classList:{toggle(){}},textContent:''};
window.addEventListener('error',e=>{const st=$('status');if(st){st.style.color='#ff8a8a';st.textContent='Error: '+(e.message||'script failed')}});
const canvas=$('c'),status=$('status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.1,100);
cam.position.set(0,2,9);cam.lookAt(0,0,0);

const root=new THREE.Group();scene.add(root);
const shell=new THREE.Group(),inner=new THREE.Group();root.add(shell,inner);
const mats=[];
// ---------- sky environment (reflections + ambient light) ----------
{const g=new THREE.SphereGeometry(60,32,16),p=g.attributes.position,cols=[];
 const top=new THREE.Color(0x5b9bff),hor=new THREE.Color(0xffe6c8),bot=new THREE.Color(0x2b3138),c=new THREE.Color();
 for(let i=0;i<p.count;i++){const y=p.getY(i)/60;c.copy(hor);if(y>0)c.lerp(top,Math.pow(y,.6));else c.lerp(bot,Math.min(1,-y*3));cols.push(c.r,c.g,c.b)}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
 const es=new THREE.Scene();es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
 const sm=new THREE.Mesh(new THREE.SphereGeometry(5,16,8),new THREE.MeshBasicMaterial({color:0xffffff}));sm.position.set(30,35,30);es.add(sm);
 try{scene.environment=new THREE.PMREMGenerator(renderer).fromScene(es,.03).texture}catch(e){console.warn('env failed',e)}}
scene.add(new THREE.HemisphereLight(0xdfefff,0x445566,.6));
const sun=new THREE.DirectionalLight(0xfff1dc,1.6);sun.position.set(6,10,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0004;sun.shadow.normalBias=.02;scene.add(sun,new THREE.AmbientLight(0xffffff,.15));

// ---------- procedural textures ----------
function tex(w,h,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;return t}
const noise=(x,w,h,n,a)=>{for(let i=0;i<n;i++){const v=Math.random()*255|0;x.fillStyle=`rgba(${v},${v},${v},${a})`;x.fillRect(Math.random()*w,Math.random()*h,2,2)}};
const W=4.4,D=3.2,H=.8,F=6,B=-F*H/2;
const glassTex=tex(512,512,(x,w,h)=>{x.clearRect(0,0,w,h);const bays=5,pw=w/bays,ph=h/F;
 for(let i=0;i<F;i++)for(let j=0;j<bays;j++){const g=x.createLinearGradient(0,i*ph,0,(i+1)*ph);g.addColorStop(0,'rgba(150,200,240,.38)');g.addColorStop(1,'rgba(70,120,170,.30)');x.fillStyle=g;x.fillRect(j*pw,i*ph,pw,ph)}
 x.strokeStyle='#1d252c';x.lineWidth=5;for(let j=0;j<=bays;j++){x.beginPath();x.moveTo(j*pw,0);x.lineTo(j*pw,h);x.stroke()}
 x.lineWidth=9;for(let i=0;i<=F;i++){x.beginPath();x.moveTo(0,i*ph);x.lineTo(w,i*ph);x.stroke()}});
const sideTex=tex(512,512,(x,w,h)=>{x.fillStyle='#cdc8bf';x.fillRect(0,0,w,h);noise(x,w,h,6000,.06);const bays=3,pw=w/bays,ph=h/F;
 for(let i=0;i<F;i++)for(let j=0;j<bays;j++){const wx=j*pw+pw*.22,wy=i*ph+ph*.22,ww=pw*.56,wh=ph*.56;x.fillStyle='#2a3946';x.fillRect(wx-4,wy-4,ww+8,wh+8);
  const g=x.createLinearGradient(0,wy,0,wy+wh);g.addColorStop(0,'#9cc4e6');g.addColorStop(1,'#456a8c');x.fillStyle=g;x.fillRect(wx,wy,ww,wh);x.fillStyle='#2a3946';x.fillRect(wx+ww/2-2,wy,4,wh)}});
const woodTex=tex(256,256,(x,w,h)=>{for(let i=0;i<8;i++){const v=110+Math.random()*40|0;x.fillStyle=`rgb(${v},${v*.68|0},${v*.42|0})`;x.fillRect(0,i*h/8,w,h/8-1)}noise(x,w,h,1500,.08)},3,2);
const concTex=tex(256,256,(x,w,h)=>{x.fillStyle='#9a9a98';x.fillRect(0,0,w,h);noise(x,w,h,5000,.1)},2,2);
const groundTex=tex(512,512,(x,w,h)=>{x.fillStyle='#4d5357';x.fillRect(0,0,w,h);noise(x,w,h,9000,.08);x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=2;
 for(let i=0;i<=8;i++){x.beginPath();x.moveTo(i*w/8,0);x.lineTo(i*w/8,h);x.moveTo(0,i*h/8);x.lineTo(w,i*h/8);x.stroke()}},3,3);

// ---------- materials & helpers ----------
const std=o=>new THREE.MeshStandardMaterial(o);
const M={glass:std({map:glassTex,transparent:true,metalness:.7,roughness:.08,envMapIntensity:1.4,side:2,depthWrite:false}),
 side:std({map:sideTex,roughness:.9}),conc:std({color:0xb8b6b0,roughness:.95}),roof:std({color:0x5a5f66,roughness:.9}),
 metal:std({color:0xb9c0c7,metalness:.9,roughness:.35}),wood:std({color:0x8a5a2b,roughness:.55}),white:std({color:0xf2f2ee,roughness:.7}),
 dark:std({color:0x22262b,roughness:.6}),fab1:std({color:0x3b6ea5,roughness:.95}),fab2:std({color:0xb8553a,roughness:.95}),
 green:std({color:0x2f7d3a,roughness:.9}),pot:std({color:0x9b4a32,roughness:.8}),screen:std({color:0x111820,emissive:0x4aa8ff,emissiveIntensity:.9}),
 light:std({color:0xffffff,emissive:0xfff0cc,emissiveIntensity:1.4}),floorW:std({map:woodTex,roughness:.5}),floorC:std({map:concTex,roughness:.8}),
 road:std({color:0x2b2e31,roughness:.95})};
const bx=(g,w,h,d,m,x,y,z,sh=true)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=sh;g.add(o);return o};
const cy=(g,r,h,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
const sph=(g,r,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);o.castShadow=true;g.add(o)};
const pl=(g,w,h,m,x,y,z,ry)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);o.position.set(x,y,z);o.rotation.y=ry;o.receiveShadow=true;g.add(o)};
const chair=(g,x,f,z)=>{bx(g,.13,.025,.13,M.dark,x,f+.14,z);bx(g,.13,.12,.02,M.dark,x,f+.22,z+.065);cy(g,.012,.09,M.metal,x,f+.09,z)};
const desk=(g,x,f,z)=>{bx(g,.5,.02,.25,M.wood,x,f+.22,z);bx(g,.02,.2,.22,M.dark,x-.22,f+.12,z);bx(g,.02,.2,.22,M.dark,x+.22,f+.12,z);
 bx(g,.15,.09,.01,M.screen,x,f+.3,z-.06);bx(g,.02,.04,.02,M.dark,x,f+.25,z-.06);chair(g,x,f,z+.22)};
const sofa=(g,x,f,z,m)=>{bx(g,.6,.08,.25,m,x,f+.07,z);bx(g,.6,.14,.06,m,x,f+.16,z-.1);bx(g,.06,.12,.25,m,x-.3,f+.1,z);bx(g,.06,.12,.25,m,x+.3,f+.1,z)};
const plant=(g,x,f,z)=>{cy(g,.05,.08,M.pot,x,f+.04,z);sph(g,.09,M.green,x,f+.16,z)};

// ---------- building ----------
const roofY=F*H/2;
// per-floor groups so the building can explode
const shellF=[],innerF=[];
for(let i=0;i<F;i++){const a=new THREE.Group(),b=new THREE.Group();shell.add(a);inner.add(b);shellF.push(a);innerF.push(b)}
const roofG=new THREE.Group();shell.add(roofG);
const plF=(g,w,m,x,y,z,ry,i)=>{const geo=new THREE.PlaneGeometry(w,H),uv=geo.attributes.uv;for(let k=0;k<uv.count;k++)uv.setY(k,(i+uv.getY(k))/F);
 const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.rotation.y=ry;o.receiveShadow=true;g.add(o)};
for(let i=0;i<F;i++){const g=shellF[i],yc=B+(i+.5)*H;
 plF(g,W,M.glass,0,yc,D/2,0,i);plF(g,W,M.glass,0,yc,-D/2,Math.PI,i);
 plF(g,D,M.side,W/2,yc,0,Math.PI/2,i);plF(g,D,M.side,-W/2,yc,0,-Math.PI/2,i);
 bx(g,W+.1,.05,.1,M.conc,0,B+i*H,D/2+.03);bx(g,W+.1,.05,.1,M.conc,0,B+i*H,-D/2-.03)}
bx(roofG,W+.2,.1,D+.2,M.roof,0,roofY+.05,0);
bx(roofG,W+.2,.12,.05,M.conc,0,roofY+.16,D/2+.075);bx(roofG,W+.2,.12,.05,M.conc,0,roofY+.16,-D/2-.075);
bx(roofG,.05,.12,D+.2,M.conc,W/2+.075,roofY+.16,0);bx(roofG,.05,.12,D+.2,M.conc,-W/2-.075,roofY+.16,0);
bx(roofG,.7,.25,.5,M.metal,-1.2,roofY+.22,-.7);bx(roofG,.5,.2,.4,M.metal,.2,roofY+.2,-.8);cy(roofG,.22,.4,M.metal,1.4,roofY+.3,-.6);bx(roofG,.7,.3,.6,M.conc,-1.5,roofY+.25,.6);
bx(shell,W+.2,.06,D+.2,M.conc,0,B-.02,0);
bx(shellF[0],1.5,.04,.7,M.metal,0,B+.62,D/2+.35);cy(shellF[0],.02,.6,M.metal,-.7,B+.31,D/2+.62);cy(shellF[0],.02,.6,M.metal,.7,B+.31,D/2+.62);
// interior (per floor)
for(let i=0;i<F;i++){
  const g=innerF[i],y=B+i*H,f=y+.05;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>bx(g,.1,H,.1,M.conc,a*2.1,y+H/2,b*1.5));
  bx(g,.5,H,.55,M.conc,1.6,y+H/2,-1.2);
  bx(g,W-.04,.05,D-.04,i?M.floorW:M.floorC,0,y+.025,0);   // floor slab
  bx(g,.5,.012,.25,M.light,-.8,y+H-.012,0,false);bx(g,.5,.012,.25,M.light,.9,y+H-.012,0,false);
  bx(g,.22,.5,.01,M.metal,1.6,f+.25,-.92);                // lift doors
  if(i<F-1)for(let k=0;k<6;k++)bx(g,.5,.06,.2,M.conc,-1.65,f+(k+1)*H/6-.03,i%2?-.2-k*.2:-1.2+k*.2);  // switchback stairs
  if(i===0){ // lobby
    bx(g,.9,.2,.25,M.wood,.2,f+.1,.2);bx(g,.95,.02,.3,M.dark,.2,f+.21,.2);
    sofa(g,-1.0,f,.95,M.fab1);sofa(g,1.0,f,.95,M.fab2);plant(g,-1.9,f,1.3);plant(g,1.9,f,1.3);
  }else if(i<4){ // offices
    [[-.8,.3],[.2,.3],[-.8,1.0],[.2,1.0]].forEach(([x,z])=>desk(g,x,f,z));
    cy(g,.25,.03,M.white,1.2,f+.22,.8);cy(g,.03,.2,M.metal,1.2,f+.12,.8);plant(g,1.9,f,1.3);
  }else{ // apartments
    bx(g,.04,H-.1,1.7,M.white,-.4,f+(H-.1)/2,-.65);
    bx(g,.6,.1,.85,M.wood,-.9,f+.05,.7);bx(g,.54,.06,.78,M.white,-.9,f+.13,.7);bx(g,.22,.04,.12,M.fab2,-.9,f+.18,.4);bx(g,.1,.12,.1,M.wood,-1.28,f+.06,.4);
    sofa(g,.5,f,.7,M.fab1);cy(g,.12,.03,M.wood,.5,f+.11,1.1);
    bx(g,.85,.18,.22,M.white,.6,f+.09,-1.4);bx(g,.9,.02,.26,M.dark,.6,f+.19,-1.4);plant(g,1.9,f,1.3);
  }
}
// site: ground, road, trees
const site=new THREE.Group();root.add(site);
{const gp=new THREE.Mesh(new THREE.PlaneGeometry(12,12),std({map:groundTex,roughness:.95}));gp.rotation.x=-Math.PI/2;gp.position.y=B-.04;gp.receiveShadow=true;site.add(gp);
 const rd=new THREE.Mesh(new THREE.PlaneGeometry(12,1.2),M.road);rd.rotation.x=-Math.PI/2;rd.position.set(0,B-.035,4.2);rd.receiveShadow=true;site.add(rd);
 for(let k=-5;k<=5;k++)bx(site,.4,.004,.04,M.white,k*1.05,B-.03,4.2,false);
 [[-3.2,3.0],[3.2,3.0],[-3.5,-.4],[3.5,-.4],[-3.2,-3],[3.2,-3],[0,-3.6]].forEach(([x,z])=>{cy(site,.03,.3,M.wood,x,B+.11,z);sph(site,.24,M.green,x,B+.42,z)})}
const grid=new THREE.GridHelper(12,24,0x2a8f99,0x123f48);grid.position.y=B-.04;grid.visible=false;root.add(grid);

const cap=bx(shell,W+.2,.1,D+.2,M.roof,0,B+F*H+.05,0);cap.visible=false;
// shell materials are cloned so x-ray fades only the outer skin
const shellMats=[];shell.traverse(o=>{if(o.isMesh){o.material=o.material.clone();shellMats.push(o.material)}});
root.traverse(o=>{if(o.isMesh)o.userData.m=o.material});
const holoMat=new THREE.MeshBasicMaterial({color:0x7dfaff,wireframe:true,transparent:true,opacity:.4});
let solidMode=true;
renderer.localClippingEnabled=true;
const clipPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),99),localPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),99);
{const all=new Set([holoMat]);root.traverse(o=>{if(o.isMesh&&o.userData.m)all.add(o.userData.m)});all.forEach(m=>{m.clippingPlanes=[clipPlane];m.clipShadows=true});cap.userData.m.clippingPlanes=null}
const FTYPE=['Lobby','Office','Office','Office','Apartment','Apartment'];
let floorsT=F,floorsF=F;
function setFloors(n){floorsT=Math.max(1,Math.min(F,Math.round(n)));$('fl').textContent='FLOORS '+floorsT+'/'+F+' · top: '+FTYPE[floorsT-1]}
setFloors(F);
$('bFm').onclick=()=>setFloors(floorsT-1);$('bFp').onclick=()=>setFloors(floorsT+1);

function applyStyle(){root.traverse(o=>{if(o.isMesh&&o.userData.m)o.material=solidMode?o.userData.m:holoMat});site.visible=solidMode;grid.visible=!solidMode}
// state
const T={x:0,y:0,rot:0,s:1},S={x:0,y:0,rot:0,s:1};
let xray=false,shellA=1,auto=true,handSeen=0;
function setX(v){xray=v;$('bX').textContent='X-ray: '+(v?'on':'off');$('bX').classList.toggle('on',v)}
$('bX').onclick=()=>setX(!xray);
let explodeT=0,E=0;
function setE(v){explodeT=v?1:0;$('bE').textContent='Explode: '+(v?'on':'off');$('bE').classList.toggle('on',v)}
$('bE').onclick=()=>setE(!explodeT);
$('bS').onclick=()=>{solidMode=!solidMode;applyStyle();$('bS').textContent='Style: '+(solidMode?'realistic':'hologram');$('bS').classList.toggle('on',solidMode)};
$('bReset').onclick=()=>{Object.assign(T,{x:0,y:0,rot:0,s:1});setX(false);setE(false);auto=true};

// mouse / touch fallback
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];auto=false});
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag||handSeen>0)return;T.rot+=(e.clientX-drag[0])*.01;T.y=Math.max(-2,Math.min(2,T.y-(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY]});
canvas.addEventListener('wheel',e=>{e.preventDefault();T.s=Math.max(.5,Math.min(2.2,T.s-e.deltaY*.001))},{passive:false});

// hand tracking
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let fistN=0,openN=0,lastC=-1,stableN=0;
const fingers=l=>{const d=(a,b)=>dist(l[a],l[b]);return [d(4,17)>d(3,17)*1.1,d(8,0)>d(6,0),d(12,0)>d(10,0),d(16,0)>d(14,0),d(20,0)>d(18,0)]};
const isZoom=f=>f[0]&&f[1]&&!f[2]&&!f[3]&&!f[4];
function onHands(r){
  const hs=r.multiHandLandmarks;
  if(!hs||!hs.length){handSeen=Math.max(0,handSeen-1);if(!handSeen)status.textContent='No hand detected — show your hand to the camera.';return}
  handSeen=15;auto=false;
  const l=hs[0],px=(l[0].x+l[9].x)/2,py=(l[0].y+l[9].y)/2;
  T.x=(.5-px)*9;T.y=(.5-py)*5;
  T.rot=-Math.atan2(l[9].x-l[0].x,-(l[9].y-l[0].y))*2.2;
  let count=0,zh=null;
  hs.forEach(h=>{const f=fingers(h);count+=f.filter(Boolean).length;if(isZoom(f))zh=h});
  if(zh){T.s=Math.max(.5,Math.min(2.2,.5+dist(zh[4],zh[8])/(dist(zh[0],zh[9])||.1)*1.3));stableN=0}
  if(count===0){fistN++;openN=0}else{openN++;fistN=0}
  if(fistN>4&&!explodeT)setE(true);
  if(openN>6&&explodeT)setE(false);
  status.textContent=zh?`Zoom ${T.s.toFixed(2)}×`:`Hand tracked`+(explodeT?' · exploded':'')+(xray?' · x-ray':'');
}
$('bCam').onclick=async()=>{
  $('bCam').disabled=true;status.textContent='Loading hand model…';
  try{
    const v=$('vid');
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}});
    await v.play();v.style.display='block';
    const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onHands);
    await hands.initialize();
    status.textContent='Hand model ready — show your hand.';
    let busy=false;
    (function loop(){
      if(!busy&&v.readyState>=2){busy=true;hands.send({image:v}).catch(()=>{}).finally(()=>{busy=false})}
      setTimeout(loop,55);   // ~18 detections/sec, keeps rendering smooth
    })();
    $('bCam').textContent='Camera on';$('bCam').classList.add('on');
  }catch(e){
    status.textContent=(e.name==='NotAllowedError'?'Camera blocked. If you opened this from WhatsApp/another app, open the link in Chrome and allow camera. ':'Camera/hand model unavailable ('+(e.name||'error')+'). ')+'Mouse/touch still works.';
    $('bCam').disabled=false;
  }
};

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;const d=Math.max(9,8/(.83*cam.aspect));cam.position.set(0,d*.22,d);cam.lookAt(0,0,0);cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  if(auto)T.rot+=.006;
  for(const p of ['x','y','rot','s'])S[p]+=(T[p]-S[p])*.12;
  E+=(explodeT-E)*.09;const GAP=.8,k=1-.45*E;
  for(let i=0;i<F;i++)shellF[i].position.y=innerF[i].position.y=i*GAP*E;roofG.position.y=F*GAP*E;
  root.position.set(S.x,S.y-2.5*E*k*S.s,0);root.rotation.y=S.rot;root.scale.setScalar(S.s*k);
  shellA+=((xray?.06:1)-shellA)*.1;
  shellMats.forEach(m=>{if(m.map===glassTex){m.opacity=shellA}else{m.transparent=shellA<.99;m.opacity=shellA;m.depthWrite=shellA>.9}});
  shell.visible=solidMode||!xray;inner.visible=solidMode||xray||E>.02;
  floorsF+=(floorsT-floorsF)*.15;const full=floorsF>F-.02||E>.02;
  root.updateMatrixWorld();localPlane.constant=full?99:B+floorsF*H;clipPlane.copy(localPlane).applyMatrix4(root.matrixWorld);
  cap.visible=!full;cap.position.y=B+floorsF*H+.05;
  try{renderer.render(scene,cam)}catch(e){$('status').textContent='Render error: '+e.message}
})();
})();
</script>
